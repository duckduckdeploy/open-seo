<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="OpenSEO: the open-source SEO suite you control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a4a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- Wordmark and tagline -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" fill="#ffffff">
      <rect x="80" y="86" width="206" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <circle cx="101" cy="103" r="5" fill="#4ade80"/>
      <text x="116" y="109" font-size="16" font-weight="600" letter-spacing="0.5">MIT · SELF-HOSTED</text>

      <text x="78" y="212" font-size="92" font-weight="800" letter-spacing="-3">OpenSEO</text>
      <text x="82" y="262" font-size="28" font-weight="500" fill-opacity="0.92">The open-source SEO suite you control.</text>
      <text x="82" y="312" font-size="18" font-weight="500" fill-opacity="0.72">Keywords · Rank tracking · Backlinks · Site audits · AI visibility · MCP for your agent</text>
    </g>

    <!-- Rank card -->
    <g transform="translate(880 92)">
      <rect width="320" height="216" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.28"/>
      <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" fill="#ffffff">
        <text x="24" y="40" font-size="15" font-weight="600" fill-opacity="0.75" letter-spacing="0.6">ORGANIC CLICKS</text>
        <text x="24" y="82" font-size="38" font-weight="800">+128%</text>
        <rect x="160" y="56" width="66" height="26" rx="13" fill="#4ade80" fill-opacity="0.25"/>
        <text x="176" y="74" font-size="14" font-weight="700" fill="#bbf7d0">▲ #3</text>
      </g>
      <g fill="url(#bar)">
        <rect x="24"  y="160" width="26" height="36" rx="5"/>
        <rect x="62"  y="148" width="26" height="48" rx="5"/>
        <rect x="100" y="152" width="26" height="44" rx="5"/>
        <rect x="138" y="132" width="26" height="64" rx="5"/>
        <rect x="176" y="122" width="26" height="74" rx="5"/>
        <rect x="214" y="108" width="26" height="88" rx="5"/>
        <rect x="252" y="96"  width="44" height="100" rx="5" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
