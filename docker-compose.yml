# The whole of OpenSEO with one command:
#
#   cp .env.example .env      # then set AUTH_SECRET and ENCRYPTION_KEY
#   docker compose up -d --build
#
# Dashboard http://localhost:3200, site http://localhost:3101, API and MCP http://localhost:4100.
#
# On a server with a domain, set OPENSEO_DOMAIN and the public URLs in .env and add HTTPS:
#   docker compose --profile https up -d --build
#
# For development, start only the database: docker compose up -d postgres

x-urls: &urls
  # Public addresses. Defaults suit one computer; set them in .env for a server with a domain.
  APP_URL: ${APP_URL:-http://localhost:3200}
  WEB_URL: ${WEB_URL:-http://localhost:3101}
  API_URL: ${PUBLIC_API_URL:-http://localhost:4100}

x-build: &build
  context: .
  args:
    API_URL: http://api:4100
    NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3200}
    NEXT_PUBLIC_SITE_URL: ${WEB_URL:-http://localhost:3101}
    NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100}
    NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: openseo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openseo}
      POSTGRES_DB: openseo
    # Only reachable from this machine; the other services use the internal network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openseo -d openseo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: *build
    image: openseo:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *urls
      NODE_ENV: production
      DATABASE_URL: postgres://openseo:${POSTGRES_PASSWORD:-openseo}@postgres:5432/openseo
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (32+ random characters)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      API_PORT: "4100"
    ports:
      - "${API_BIND:-127.0.0.1}:4100:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: *build
    image: openseo:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /openseo/apps/app
    command: ["node_modules/.bin/next", "start", "-p", "3200", "-H", "0.0.0.0"]
    environment:
      API_URL: http://api:4100
    ports:
      - "${APP_BIND:-127.0.0.1}:3200:3200"

  web:
    build: *build
    image: openseo:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /openseo/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3101", "-H", "0.0.0.0"]
    environment:
      API_URL: http://api:4100
    ports:
      - "${WEB_BIND:-127.0.0.1}:3101:3101"

  # HTTPS for a server with a domain: certificates from Let's Encrypt, renewed automatically.
  # Point OPENSEO_DOMAIN, app.OPENSEO_DOMAIN and api.OPENSEO_DOMAIN at the server first.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app, web, api]
    environment:
      OPENSEO_DOMAIN: ${OPENSEO_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  caddy-data:
  caddy-config:
